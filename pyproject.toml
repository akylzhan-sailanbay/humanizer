[project]
name = "humanizer"
version = "0.1.0"
description = "Detector-robustness research system: distribution-matched text transformation and its evaluation"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["humanizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs model downloads or takes >30s",
    "final: requires --final-evaluation; opens the sealed held-out panel",
]
addopts = "-m 'not slow and not final' -q --tb=short"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
